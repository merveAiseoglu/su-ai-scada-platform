name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: merve-dev-password
          POSTGRES_DB: su_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        
    - name: Lint with Ruff
      working-directory: ./backend
      run: |
        ruff check app
        ruff format --check app
        
    - name: Run tests with pytest
      working-directory: ./backend
      env:
        TEST_DATABASE_URL: postgresql+asyncpg://postgres:merve-dev-password@localhost:5432/su_ai_test
      run: |
        pytest --cov=app.engine --cov-fail-under=90 tests/
